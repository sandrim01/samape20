<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMAPEOP - Sistema de Manutenção</title>
  <link rel="icon" type="image/x-icon" href="resources/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="resources/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="resources/favicon-16x16.png">
  <link rel="icon" type="image/png" href="resources/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="resources/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Registrar Service Worker para permitir abertura 100% offline do app
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => {
        console.log('✅ Service Worker registrado com sucesso (Modo Offline PWA ativo).');
        reg.update();
      }).catch(err => {
        console.log('ℹ️ Registro de SW:', err.message);
      });
    }
  </script>
</head>

<body>
  <div id="app"></div>
  <script src="api-client.js"></script>
  <script src="offline-manager.js"></script>
  <script src="jsqr.min.js"></script>
  <script src="qr-scanner.js"></script>
  <script src="os-modal.js"></script>
  <script src="listagem-pecas-modal.js"></script>
  <script src="preventivas.js"></script>
  <script src="app.js"></script>
</body>

</html>
